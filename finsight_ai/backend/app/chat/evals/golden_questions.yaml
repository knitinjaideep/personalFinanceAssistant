# ── Affordability (13 questions) ─────────────────────────────────────────────
# Regression requirements:
#   - Purchase questions must NOT mention down payment or closing costs.
#   - House questions MUST show down payment, closing costs, cash needed at close.
#   - All answers must show assumptions and caveats.
#   - Gemma must not change the Python verdict.
#   - These questions must NOT all produce the same output.

- id: afford_001
  question: "Can we afford a Birkin bag by Hermes?"
  expected:
    intent: "affordability"
    domain: "sql"
    route_type: "affordability"
    task_type: "purchase_affordability"
    answer_must_include:
      - "$"
    answer_must_not_include:
      - "Could you mention an account"
      - "institution, category"
      - "unknown"
      - "down payment"
      - "closing cost"

- id: afford_002
  question: "Can I afford a $20,000 handbag?"
  expected:
    intent: "affordability"
    domain: "sql"
    route_type: "affordability"
    task_type: "purchase_affordability"
    purchase_price: 20000
    answer_must_include:
      - "$"
    answer_must_not_include:
      - "Could you mention an account"
      - "institution, category"
      - "down payment"
      - "closing cost"

- id: afford_003
  question: "Do I have enough money for a 1.3 million house?"
  expected:
    intent: "affordability"
    domain: "sql"
    route_type: "affordability"
    task_type: "home_affordability"
    purchase_price: 1300000
    answer_must_include:
      - "$"
    answer_must_not_include:
      - "Could you mention an account"
      - "institution, category"

- id: afford_004
  question: "Can we buy a $75,000 car?"
  expected:
    intent: "affordability"
    domain: "sql"
    route_type: "affordability"
    task_type: "purchase_affordability"
    purchase_price: 75000
    answer_must_include:
      - "$"
    answer_must_not_include:
      - "Could you mention an account"
      - "institution, category"
      - "down payment"
      - "closing cost"

- id: afford_005
  question: "Can we afford a $10,000 vacation?"
  expected:
    intent: "affordability"
    domain: "sql"
    route_type: "affordability"
    task_type: ["goal_affordability", "purchase_affordability"]
    purchase_price: 10000
    answer_must_include:
      - "$"
    answer_must_not_include:
      - "Could you mention an account"
      - "institution, category"
      - "down payment"
      - "closing cost"

- id: afford_006
  question: "Would buying a Birkin hurt our house savings?"
  expected:
    intent: "affordability"
